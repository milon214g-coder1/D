name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::রিপোর মূল ফোল্ডারে কোনো .zip ফাইল পাওয়া যায়নি। আগে zip ফাইলটা আপলোড করুন।"
            exit 1
          fi
          echo "Found zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .

      - name: Fix root build.gradle repository conflict
        run: |
          cat > rajmistri-android/build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.3.2'
              }
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Fix app compileSdk and targetSdk
        run: |
          sed -i 's/compileSdk 33/compileSdk 34/' rajmistri-android/app/build.gradle
          sed -i 's/targetSdk 33/targetSdk 34/' rajmistri-android/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Build debug APK
        working-directory: rajmistri-android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RajMistriBD-debug-apk
          path: rajmistri-android/app/build/outputs/apk/debug/*.apk
